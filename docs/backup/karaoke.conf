app_name=谢姐K歌台
# 跑马灯欢迎语
welcome=欢迎来到谢姐K歌台，
# 今晚直播：整段开场词要念完，台词不因开唱提前收，最多停 45 秒
opening_secs=45
opening_hold=1
# 四种提醒（只在直播模式显示）：开播 / 中场休息 / 下播预告 / 下播提醒。
# live_start、live_end 必须都是严格 HH:mm 且结束晚于开始；写错就静默关闭全部提醒。
live_start=18:30
live_end=20:00

# 下面这些是可选的（写成注释即用内置默认值；去掉行首 # 即可覆盖）：
# live_start_text=直播开始啦       开播提醒文案
# live_break_text=中场休息一下     中场休息文案（节目单走到第 7 个节目时弹）
# live_warn_text=还有 %d 个节目     下播预告文案，%d 会换成剩余节目数（倒数第 2 个节目触发）
# live_end_text=直播结束啦        下播提醒文案
